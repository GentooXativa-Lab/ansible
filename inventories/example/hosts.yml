# vim: set ft=yaml:
# vim: set ts=2 sw=2 et:

all:
  children:
    # Group containing cloud-hosted servers (VPS)
    cloud:
      hosts:
        cloud-vps-001:
          ansible_host: cloud-vps-001.example.com
          host_tags:
          - vps
          - remote
    
    # Group containing external provider hosted servers
    external:
      hosts:
        external-vps-001:
          ansible_host: 1.2.3.4  # Replace with actual IP
          host_tags:
          - vps
          - remote
        external-vps-002:
          ansible_host: 5.6.7.8  # Replace with actual IP
          host_tags:
          - vps
          - remote
          - blog
          - cdn-target
          
    # Group containing Docker hosts
    docker:
      hosts:
        docker-node-001:
          ansible_host: docker-node-001.local
          host_tags:
          - docker
          - vm
        docker-node-002:
          ansible_host: docker-node-002.local
          host_tags:
          - docker
          - vm
          
    # Group containing Raspberry Pi nodes
    raspberrypi:
      hosts:
        rpi-node-100:
          ansible_host: rpi-node-100.local
          host_tags:
          - rpi4
        rpi-node-101:
          ansible_host: rpi-node-101.local
          host_tags:
          - rpi4
        rpi-node-500:
          ansible_host: rpi-node-500.local
          host_tags:
          - rpi5
          
    # Group containing on-premise servers
    servers:
      hosts:
        server-001:
          ansible_host: server-001.local
          ansible_user: root  # For Proxmox hosts
          host_tags:
          - proxmox
        server-002:
          ansible_host: server-002.local
          ansible_user: root  # For Proxmox hosts
          host_tags:
          - proxmox
        media-server:
          ansible_host: media-server.local
          host_tags:
          - media-server
        proxy-server:
          ansible_host: proxy-server.local
          host_tags:
          - nginx-proxy-manager
          - wireguard-server
        k3s-node-001:
          ansible_host: k3s-node-001.local
          host_tags:
          - vm
        k3s-node-002:
          ansible_host: k3s-node-002.local
          host_tags:
          - vm
          
    # Group containing laptops
    laptop:
      hosts:
        dev-laptop:
          skip_update: true  # Skip system updates for personal devices
          ansible_host: laptop-wlan.local
          
    # Group containing workstations
    workstation:
      hosts:
        dev-workstation:
          skip_update: true  # Skip system updates for personal devices
          ansible_host: dev-workstation.local

# Custom groupings
# Group containing all on-premise homelab hosts
homelab:
  children:
    raspberrypi:
    servers:

# Group containing all hosts (on-premise)
onprem:
  children:
    docker:
    raspberrypi:
    servers:
    laptop:
    workstation: