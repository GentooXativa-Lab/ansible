---
- name: Reboot hosts and wait for them to come back
  hosts: all
  become: true
  gather_facts: false
  vars:
    ansible_port: "{{ exposed_ssh_port | default(22) }}"
  
  tasks:
    - name: Reboot the hosts
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      
    - name: Wait for hosts to be reachable
      ansible.builtin.wait_for_connection:
        connect_timeout: 20
        sleep: 5
        delay: 5
        timeout: 300
    
    - name: Gather facts after reboot
      ansible.builtin.setup:
      
    - name: Display uptime after reboot
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is back online - Uptime: {{ ansible_uptime_seconds }} seconds"