---
- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Deploy sudoers configuration from template
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
    backup: yes

- name: Create sudoers.d directory
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Deploy individual sudoers.d files
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
  loop: "{{ sudoers_d_files | default([]) }}"
  when: sudoers_d_files is defined